name: Docker Image CI

on:
  push:
    tags:
      - v*

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 获取当前的 git tag 作为版本号
    - name: Get current tag
      id: get_tag
      run: echo "TAG=$(echo ${GITHUB_REF} | sed 's/refs\/tags\///')" >> $GITHUB_ENV

    # 设置 latest 标签
    - name: Set latest tag
      run: |
        git fetch --tags
        git tag -f latest

    # Build the Docker image
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ github.repository }}:${{ env.TAG }} --tag ghcr.io/${{ github.repository }}:latest

    # Log in to GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Push the Docker image to GitHub Container Registry
    - name: Push the Docker image
      run: |
        docker push ghcr.io/${{ github.repository }}:${{ env.TAG }}
        docker push ghcr.io/${{ github.repository }}:latest
