name: Docker Image CI

on:
  push:
    tags:
      - v*

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 获取当前的 git tag 作为版本号
    - name: Get current tag
      id: get_tag
      run: echo "TAG=$(echo ${GITHUB_REF} | sed 's/refs\/tags\///')" >> $GITHUB_ENV

    # 将 GitHub 仓库所有者（github.repository_owner）转换为小写，以符合命名规则
    - name: Convert repository owner to lowercase
      run: echo "REPO_OWNER=$(echo ${GITHUB_REPOSITORY_OWNER} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    # 设置 latest 标签
    - name: Set latest tag
      run: |
        git fetch --tags
        git tag -f latest

    # Build the Docker image
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ env.REPO_OWNER }}/wechat-rails:${{ env.TAG }} --tag ghcr.io/${{ env.REPO_OWNER }}/wechat-rails:latest

    # Log in to GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Push the Docker image to GitHub Container Registry
    - name: Push the Docker image
      run: |
        docker push ghcr.io/${{ env.REPO_OWNER }}/wechat-rails:${{ env.TAG }}
        docker push ghcr.io/${{ env.REPO_OWNER }}/wechat-rails:latest
